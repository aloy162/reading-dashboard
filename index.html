<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>독서 대시보드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600&family=DM+Mono:wght@400;500&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #F7F5F0;
    --surface: #FFFFFF;
    --surface2: #F0EDE6;
    --ink: #1A1816;
    --ink2: #6B6560;
    --ink3: #A8A39C;
    --accent: #2C5F4A;
    --accent2: #E8A020;
    --accent3: #C74B35;
    --border: rgba(26,24,22,0.10);
    --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  .header {
    background: var(--ink);
    color: #fff;
    padding: 2rem 2.5rem 1.75rem;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 1rem;
  }
  .header-left h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 28px;
    font-weight: 600;
    letter-spacing: -0.02em;
    line-height: 1.2;
  }
  .header-left p {
    font-size: 12px;
    color: rgba(255,255,255,0.45);
    margin-top: 6px;
    font-family: 'DM Mono', monospace;
  }
  .year-tabs {
    display: flex;
    gap: 4px;
  }
  .year-tab {
    padding: 6px 14px;
    border-radius: 99px;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    cursor: pointer;
    font-family: 'Pretendard', sans-serif;
    transition: all 0.15s;
  }
  .year-tab.active, .year-tab:hover {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border-color: rgba(255,255,255,0.4);
  }
  .main { padding: 2rem 2.5rem; display: flex; flex-direction: column; gap: 1.5rem; }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .metric-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 1.25rem 1.5rem;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .metric-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
  }
  .metric-card.green::before { background: var(--accent); }
  .metric-card.amber::before { background: var(--accent2); }
  .metric-card.red::before { background: var(--accent3); }
  .metric-card.gray::before { background: var(--ink3); }
  .metric-label { font-size: 11px; color: var(--ink3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 10px; }
  .metric-value { font-size: 32px; font-weight: 600; font-family: 'DM Mono', monospace; line-height: 1; color: var(--ink); }
  .metric-sub { font-size: 11px; color: var(--ink3); margin-top: 8px; }

  .row-2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

  .card {
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1.5rem;
  }
  .card-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink3);
    margin-bottom: 1.25rem;
  }
  .chart-wrap { position: relative; }

  .bar-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .bar-name { font-size: 12px; color: var(--ink2); width: 70px; flex-shrink: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-track { flex: 1; background: var(--surface2); border-radius: 3px; height: 7px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
  .bar-count { font-size: 12px; color: var(--ink3); font-family: 'DM Mono', monospace; width: 22px; text-align: right; }

  .book-item { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--border); }
  .book-item:last-child { border-bottom: none; padding-bottom: 0; }
  .book-rank { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink3); width: 16px; flex-shrink: 0; padding-top: 2px; }
  .book-info { flex: 1; min-width: 0; }
  .book-title { font-size: 13px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .book-meta { font-size: 11px; color: var(--ink3); margin-top: 2px; }
  .stars { color: var(--accent2); font-size: 12px; flex-shrink: 0; }

  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .legend-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 12px; }
  .legend-row .label { display: flex; align-items: center; color: var(--ink2); }
  .legend-row .val { font-family: 'DM Mono', monospace; color: var(--ink3); }

  .loading {
    display: flex; align-items: center; justify-content: center;
    height: 300px; color: var(--ink3); font-size: 14px; letter-spacing: 0.05em;
    flex-direction: column; gap: 12px;
  }
  .spinner {
    width: 24px; height: 24px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .goal-section { display: flex; flex-direction: column; gap: 10px; }
  .goal-row { display: flex; align-items: center; justify-content: space-between; }
  .goal-num { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; }
  .goal-sub { font-size: 11px; color: var(--ink3); }
  .goal-track { background: var(--surface2); border-radius: 99px; height: 8px; overflow: hidden; margin-top: 4px; }
  .goal-fill { height: 100%; border-radius: 99px; background: var(--accent); transition: width 0.8s ease; }

  .month-chart-wrap { display: flex; align-items: flex-end; gap: 4px; height: 80px; }
  .month-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .month-bar-wrap { flex: 1; display: flex; align-items: flex-end; width: 100%; }
  .month-bar { width: 100%; border-radius: 3px 3px 0 0; min-height: 2px; transition: height 0.5s ease; }
  .month-label { font-size: 9px; color: var(--ink3); font-family: 'DM Mono', monospace; }
  .month-count { font-size: 9px; color: var(--ink3); font-family: 'DM Mono', monospace; }

  .error-msg { color: var(--accent3); font-size: 13px; text-align: center; padding: 2rem; }

  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 11px;
    color: var(--ink3);
    font-family: 'DM Mono', monospace;
    border-top: 1px solid var(--border);
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <h1>독서 기록</h1>
    <p id="last-updated">데이터 불러오는 중…</p>
  </div>
  <div class="year-tabs" id="year-tabs"></div>
</div>

<div class="main" id="main-content">
  <div class="loading"><div class="spinner"></div><span>데이터 불러오는 중</span></div>
</div>

<footer id="footer"></footer>

<script>
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSLlR8sumZmXcwVTjqutAXrSuRajkdX1_BcLdy2FjF9Op3TkKuop6XkWdWoaD2SRsNEevJyDX7bA_b1/pub?gid=0&single=true&output=csv';

const FIELD_COLORS = [
  '#2C5F4A','#E8A020','#C74B35','#4A7FA5','#7B5EA7','#D4845A','#5A9E8F','#B5603A','#8E6B3E','#4A6B8A'
];
const STATUS_COLORS = { '완독': '#2C5F4A', '진행': '#4A7FA5', '중단': '#A8A39C', '예정': '#E8A020' };
const YEAR_ALL = '전체';

let allBooks = [];
let selectedYear = YEAR_ALL;
let donutChart = null;

function countStars(s) {
  if (!s) return null;
  const n = (s.match(/⭐/g) || []).length;
  return n > 0 ? n : null;
}

function parseDate(s) {
  if (!s) return null;
  s = s.trim().split('→')[0].trim();
  let m = s.match(/^(\d{4})\/(\d{2})\/(\d{2})/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3]);
  try { const d = new Date(s); if (!isNaN(d)) return d; } catch(e) {}
  return null;
}

function getYear(book) {
  const d = book.완료일 || book.시작일;
  return d ? d.getFullYear() : null;
}

function filterBooks(year) {
  if (year === YEAR_ALL) return allBooks.filter(b => b.상태 === '완독' || b.상태 === '완료');
  return allBooks.filter(b => {
    const y = getYear(b);
    return y === +year && (b.상태 === '완독' || b.상태 === '완료');
  });
}

function getAvailableYears() {
  const years = new Set();
  allBooks.forEach(b => { const y = getYear(b); if (y) years.add(y); });
  return Array.from(years).sort((a,b) => b-a);
}

function renderYearTabs(years) {
  const el = document.getElementById('year-tabs');
  const all = [YEAR_ALL, ...years];
  el.innerHTML = all.map(y =>
    `<button class="year-tab${selectedYear == y ? ' active' : ''}" data-year="${y}">${y}</button>`
  ).join('');
  el.querySelectorAll('.year-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      selectedYear = btn.dataset.year;
      renderYearTabs(years);
      renderDashboard();
    });
  });
}

function renderDashboard() {
  const books = filterBooks(selectedYear);
  const total = books.length;
  const rated = books.filter(b => b.별점 !== null);
  const avgRating = rated.length ? (rated.reduce((s,b) => s+b.별점, 0)/rated.length).toFixed(1) : '-';

  const durations = books.filter(b => b.시작일 && b.완료일).map(b => {
    return Math.round((b.완료일 - b.시작일) / (1000*60*60*24));
  });
  const avgDays = durations.length ? Math.round(durations.reduce((a,b)=>a+b,0)/durations.length) : '-';

  const fieldMap = {};
  books.forEach(b => {
    const f = b.분야 || b.카테고리 || '기타';
    fieldMap[f] = (fieldMap[f]||0)+1;
  });
  const fieldSorted = Object.entries(fieldMap).sort((a,b)=>b[1]-a[1]);

  const monthMap = {};
  for (let m=1; m<=12; m++) monthMap[m] = 0;
  books.forEach(b => {
    if (b.완료일) monthMap[b.완료일.getMonth()+1]++;
  });

  const starDist = {5:0,4:0,3:0,2:0,1:0};
  rated.forEach(b => { if(starDist[b.별점] !== undefined) starDist[b.별점]++; });

  const top5 = [...books].filter(b=>b.별점===5).slice(0,5);
  const statusMap = {};
  allBooks.forEach(b => {
    const s = b.상태||'예정';
    statusMap[s] = (statusMap[s]||0)+1;
  });

  const GOAL = 60;
  const pct = Math.min(100, Math.round(total/GOAL*100));

  const maxMonth = Math.max(...Object.values(monthMap), 1);
  const MONTHS = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

  document.getElementById('main-content').innerHTML = `
    <div class="metrics">
      <div class="metric-card green">
        <div class="metric-label">완독</div>
        <div class="metric-value">${total}</div>
        <div class="metric-sub">권</div>
      </div>
      <div class="metric-card amber">
        <div class="metric-label">평균 별점</div>
        <div class="metric-value">${avgRating}</div>
        <div class="metric-sub">/ 5점 만점</div>
      </div>
      <div class="metric-card red">
        <div class="metric-label">평균 완독 기간</div>
        <div class="metric-value">${avgDays}</div>
        <div class="metric-sub">일 / 권</div>
      </div>
      <div class="metric-card gray">
        <div class="metric-label">연간 목표 달성률</div>
        <div class="metric-value">${pct}%</div>
        <div class="metric-sub">${GOAL}권 목표</div>
      </div>
    </div>

    <div class="row-2">
      <div class="card">
        <div class="card-title">월별 완독 권수</div>
        <div class="month-chart-wrap">
          ${Object.entries(monthMap).map(([m,cnt]) => `
            <div class="month-col">
              <div class="month-count">${cnt||''}</div>
              <div class="month-bar-wrap">
                <div class="month-bar" style="height:${Math.round(cnt/maxMonth*100)}%;background:${cnt===maxMonth?'var(--accent)':'#C8C2B8'};"></div>
              </div>
              <div class="month-label">${MONTHS[+m-1]}</div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-title">연간 목표</div>
        <div class="goal-section">
          <div>
            <div class="goal-row">
              <div>
                <div class="goal-num">${total} <span style="font-size:14px;color:var(--ink3);">/ ${GOAL}권</span></div>
                <div class="goal-sub" style="margin-top:4px;">목표까지 ${Math.max(0,GOAL-total)}권 남음</div>
              </div>
              <div style="font-size:24px;font-family:'DM Mono',monospace;color:var(--accent);">${pct}%</div>
            </div>
            <div class="goal-track" style="margin-top:12px;">
              <div class="goal-fill" style="width:${pct}%;"></div>
            </div>
          </div>
          <div style="margin-top:8px;">
            <div class="card-title" style="margin-bottom:8px;">전체 상태 현황</div>
            ${Object.entries(statusMap).map(([s,n]) => `
              <div class="legend-row">
                <span class="label"><span class="status-dot" style="background:${STATUS_COLORS[s]||'#ccc'};"></span>${s}</span>
                <span class="val">${n}</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>

    <div class="row-2">
      <div class="card">
        <div class="card-title">분야별 독서 현황</div>
        ${fieldSorted.slice(0,8).map(([name,cnt],i) => `
          <div class="bar-item">
            <span class="bar-name" title="${name}">${name}</span>
            <div class="bar-track">
              <div class="bar-fill" style="width:${Math.round(cnt/fieldSorted[0][1]*100)}%;background:${FIELD_COLORS[i%FIELD_COLORS.length]};"></div>
            </div>
            <span class="bar-count">${cnt}</span>
          </div>
        `).join('')}
      </div>

      <div class="card">
        <div class="card-title">별점 분포</div>
        ${[5,4,3,2,1].map(s => `
          <div class="bar-item">
            <span class="bar-name" style="color:var(--accent2);">${'★'.repeat(s)}${'☆'.repeat(5-s)}</span>
            <div class="bar-track">
              <div class="bar-fill" style="width:${rated.length?Math.round(starDist[s]/rated.length*100):0}%;background:var(--accent2);opacity:${0.4+s*0.12};"></div>
            </div>
            <span class="bar-count">${starDist[s]}</span>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-title">★★★★★ 책 목록</div>
      ${top5.length ? top5.map((b,i) => `
        <div class="book-item">
          <span class="book-rank">${String(i+1).padStart(2,'0')}</span>
          <div class="book-info">
            <div class="book-title">${b.제목}</div>
            <div class="book-meta">${b.분야||b.카테고리||''} ${b.작가 ? '· '+b.작가 : ''}</div>
          </div>
          <span class="stars">★★★★★</span>
        </div>
      `).join('') : '<div style="color:var(--ink3);font-size:13px;padding:1rem 0;">5점 책이 없습니다</div>'}
    </div>
  `;

  document.getElementById('footer').textContent = `마지막 업데이트: ${new Date().toLocaleString('ko-KR')} · 새로고침하면 최신 데이터 반영`;
}

function loadData() {
  Papa.parse(SHEET_CSV_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      allBooks = results.data.map(row => ({
        제목: row['제목'] || row['Title'] || '',
        상태: row['상태'] || row['Status'] || '',
        분야: row['분야'] || row['카테고리'] || '',
        태그: row['태그'] || '',
        별점: countStars(row['평점']),
        시작일: parseDate(row['시작일']),
        완료일: parseDate(row['완료일']),
        작가: row['저자'] || row['작가'] || '',
        카테고리: row['카테고리'] || '',
      })).filter(b => b.제목 && b.제목 !== '새로운 책');

      const years = getAvailableYears();
      if (years.length > 0) selectedYear = String(years[0]);

      document.getElementById('last-updated').textContent =
        `총 ${allBooks.length}권 · 새로고침 시 자동 업데이트`;

      renderYearTabs(years);
      renderDashboard();
    },
    error: function(err) {
      document.getElementById('main-content').innerHTML =
        `<div class="error-msg">데이터를 불러오지 못했습니다.<br>구글 시트 공개 설정을 확인해주세요.<br><small>${err.message||''}</small></div>`;
    }
  });
}

loadData();
</script>
</body>
</html>
